spring.application.name=my-erp_pessoal

# Datasource — values come from environment variables (set in .env locally, Railway in prod)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_pessoal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA — validate only, schema is managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP — sized for Supabase free tier (max 60 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
