<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Productivity Hub v5.0 - ERP Integrado</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.01); }
        .morning-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%); }
        .career-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .progress-ring { transition: stroke-dashoffset 0.35s; transform: rotate(-90deg); transform-origin: 50% 50%; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, size = 20, className = "" }) => {
        const icons = {
            dashboard: <path d="M3 3h7v10H3zm11 0h7v5h-7zm0 9h7v9h-7zm-11 7h7v2H3z"/>,
            calendar: <React.Fragment><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4m-5 4h18"/></React.Fragment>,
            check: <path d="M20 6L9 17l-5-5"/>,
            brain: <path d="M9.5 2A5.5 5.5 0 004 7.5c0 1.63.7 3.1 1.82 4.12A4.5 4.5 0 005.5 20h13a4.5 4.5 0 00-.32-8.38A5.5 5.5 0 0014.5 2h-5z"/>,
            zap: <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>,
            clock: <React.Fragment><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></React.Fragment>,
            note: <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"/>,
            copy: <React.Fragment><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></React.Fragment>,
            code: <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>,
            linkedin: <React.Fragment><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></React.Fragment>,
            briefcase: <React.Fragment><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></React.Fragment>,
            pill: <React.Fragment><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></React.Fragment>,
            fitness: <path d="M18 10V6a2 2 0 00-2-2H8a2 2 0 00-2 2v4a4 4 0 004 4h4a4 4 0 004-4zM7 21h10m-5-7v7"/>,
            refresh: <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8m0-5v5h-5"/>,
            plus: <path d="M12 5v14M5 12h14"/>,
            trash: <path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>,
            close: <path d="M18 6L6 18M6 6l12 12"/>
        };
        return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {icons[name]}
            </svg>
        );
    };

    const App = () => {
        const [fixedRoutine, setFixedRoutine] = useState([]);
        const [notes, setNotes] = useState('');
        const [activeTab, setActiveTab] = useState('dashboard');
        const [showResetConfirm, setShowResetConfirm] = useState(false);
        const [confirmDeleteId, setConfirmDeleteId] = useState(null);

        const [showAddModal, setShowAddModal] = useState(false);
        const [newTask, setNewTask] = useState({ title: '', time: '', type: 'basic' });

        // --- CARREGAMENTO INICIAL DO BANCO DE DADOS ---
        useEffect(() => {
            const loadData = async () => {
                try {
                    const resTasks = await fetch('/api/productivity/tasks');
                    if (resTasks.ok) setFixedRoutine(await resTasks.json());

                    const resNotes = await fetch('/api/productivity/notes');
                    if (resNotes.ok) {
                        const dataNotes = await resNotes.json();
                        setNotes(dataNotes.content || '');
                    }
                } catch (error) {
                    console.error("Erro ao carregar dados", error);
                }
            };
            loadData();
        }, []);

        // --- AUTO-SAVE DO RASCUNHO (Debounce de 1 segundo) ---
        useEffect(() => {
            const timer = setTimeout(async () => {
                try {
                    await fetch('/api/productivity/notes', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: notes })
                    });
                } catch (error) { console.error("Erro ao salvar nota", error); }
            }, 1000);
            return () => clearTimeout(timer); // Cancela o timer se o usuário voltar a digitar antes de 1s
        }, [notes]);

        const progress = useMemo(() => {
            if (fixedRoutine.length === 0) return 0;
            const done = fixedRoutine.filter(r => r.done).length;
            return Math.round((done / fixedRoutine.length) * 100);
        }, [fixedRoutine]);

        const currentTask = useMemo(() => {
            return fixedRoutine.find(r => !r.done) || { title: 'Dia concluído!', time: '17:00', type: 'basic' };
        }, [fixedRoutine]);

        // --- INTEGRAÇÕES COM A API ---
        const toggleRoutine = async (id) => {
            // Atualização otimista na tela
            setFixedRoutine(fixedRoutine.map(r => r.id === id ? { ...r, done: !r.done } : r));
            try {
                await fetch(`/api/productivity/tasks/${id}/toggle`, { method: 'PUT' });
            } catch (error) { console.error("Erro no toggle", error); }
        };

        const resetRoutine = async () => {
            setFixedRoutine(fixedRoutine.map(r => ({ ...r, done: false })));
            setShowResetConfirm(false);
            try {
                await fetch('/api/productivity/tasks/reset', { method: 'POST' });
            } catch (error) { console.error("Erro no reset", error); }
        };

        const addTask = async () => {
            if (!newTask.title || !newTask.time) return;

            try {
                const response = await fetch('/api/productivity/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...newTask, done: false })
                });

                if (response.ok) {
                    const savedTask = await response.json();
                    const newRoutine = [...fixedRoutine, savedTask];
                    newRoutine.sort((a, b) => a.time.localeCompare(b.time));
                    setFixedRoutine(newRoutine);
                    setShowAddModal(false);
                    setNewTask({ title: '', time: '', type: 'basic' });
                }
            } catch (error) { console.error("Erro ao adicionar", error); }
        };

        const deleteTask = async (id) => {
            setFixedRoutine(fixedRoutine.filter(r => r.id !== id));
            setConfirmDeleteId(null);
            try {
                await fetch(`/api/productivity/tasks/${id}`, { method: 'DELETE' });
            } catch (error) { console.error("Erro ao excluir", error); }
        };

        const getTaskIcon = (item) => {
            if (item.type === 'health') return item.title.includes('Remédio') ? <Icon name="pill" className="text-pink-500" /> : <Icon name="fitness" className="text-orange-500" />;
            if (item.type === 'study') return <Icon name="code" className="text-blue-500" />;
            if (item.type === 'career') return <Icon name="linkedin" className="text-emerald-500" />;
            if (item.type === 'work') return <Icon name="briefcase" className="text-indigo-500" />;
            return <Icon name="clock" className="text-slate-400" />;
        };

        return (
            <div className="flex h-screen bg-slate-50 overflow-hidden">
                {/* Sidebar */}
                <aside className="w-20 lg:w-64 bg-white border-r border-slate-200 flex flex-col transition-all">
                    <div className="p-6 flex items-center gap-3">
                        <div className="w-10 h-10 morning-gradient rounded-xl flex items-center justify-center text-white shadow-lg">
                            <Icon name="brain" size={24} />
                        </div>
                        <span className="hidden lg:block font-black text-xl tracking-tight text-slate-800 uppercase">GeminiHub</span>
                    </div>
                    <nav className="flex-1 px-4 space-y-2">
                        <SidebarItem icon="dashboard" label="Dashboard" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                        <SidebarItem icon="clock" label="Meu Dia" active={activeTab === 'day'} onClick={() => setActiveTab('day')} />
                        <SidebarItem icon="zap" label="IA Comandos" active={activeTab === 'ai'} onClick={() => setActiveTab('ai')} />
                    </nav>
                    <div className="p-6">
                        <div className="hidden lg:block bg-slate-50 rounded-2xl p-4 border border-slate-100 text-center">
                            <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">Status Geral</p>
                            <div className="text-2xl font-black text-indigo-600">{progress}%</div>
                        </div>
                    </div>
                </aside>

                {/* Main Content */}
                <main className="flex-1 overflow-y-auto p-6 lg:p-12 custom-scrollbar">
                    <header className="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
                        <div>
                            <h2 className="text-4xl font-black tracking-tighter text-slate-900 italic underline decoration-indigo-500 underline-offset-8 uppercase tracking-widest">Cronograma Diário</h2>
                            <p className="text-slate-500 font-medium mt-3 tracking-tight">Foco Total: Java Pós-Graduação & Performance Profissional.</p>
                        </div>

                        <div className="flex flex-col items-end gap-2">
                            <div className="bg-white px-6 py-3 rounded-2xl card-shadow border border-slate-100 flex items-center gap-4">
                                <div className="text-right">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Concluído</p>
                                    <p className="text-sm font-black text-indigo-600">{progress}%</p>
                                </div>
                                <div className="w-12 h-12 relative flex items-center justify-center">
                                    <svg className="w-full h-full" viewBox="0 0 36 36">
                                        <circle className="stroke-slate-100" strokeWidth="3" fill="transparent" r="16" cx="18" cy="18" />
                                        <circle className="stroke-indigo-600 progress-ring" strokeWidth="3" strokeDasharray="100, 100" strokeDashoffset={100 - progress} strokeLinecap="round" fill="transparent" r="16" cx="18" cy="18" />
                                    </svg>
                                </div>
                            </div>

                            <div className="relative">
                                {!showResetConfirm ? (
                                    <button
                                        onClick={() => setShowResetConfirm(true)}
                                        className="flex items-center gap-2 text-[10px] font-bold text-slate-400 hover:text-red-500 transition-colors uppercase tracking-widest px-2"
                                    >
                                        <Icon name="refresh" size={14} /> Reset Diário
                                    </button>
                                ) : (
                                    <div className="flex items-center gap-3 bg-red-50 p-2 rounded-xl border border-red-100 shadow-sm animate-in fade-in slide-in-from-top-1">
                                        <span className="text-[10px] font-bold text-red-600 uppercase px-1">Certeza?</span>
                                        <button onClick={resetRoutine} className="text-[10px] font-black text-white bg-red-500 px-3 py-1 rounded-lg hover:bg-red-600 transition-all">SIM</button>
                                        <button onClick={() => setShowResetConfirm(false)} className="text-[10px] font-bold text-slate-400 hover:text-slate-600 px-1">NÃO</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {activeTab === 'dashboard' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-8">
                                <section className="bg-white p-8 rounded-[2.5rem] card-shadow border border-slate-50 relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h3 className="text-sm font-black text-indigo-500 uppercase tracking-widest mb-4">Próximo Passo</h3>
                                        <div className="flex items-center gap-6">
                                            <div className="text-5xl font-black text-slate-800 tracking-tighter">{currentTask.time}</div>
                                            <div>
                                                <p className="text-xl font-bold text-slate-700">{currentTask.title}</p>
                                                <div className="flex items-center gap-2 mt-1">
                                                    {getTaskIcon(currentTask)}
                                                    <p className="text-slate-400 text-sm font-medium">Bloco ativo na rotina</p>
                                                </div>
                                            </div>
                                        </div>

                                        {currentTask.id && (
                                            <div className="mt-8 flex justify-end">
                                                <button
                                                    onClick={() => toggleRoutine(currentTask.id)}
                                                    className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-3 hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200 active:scale-95"
                                                >
                                                    <Icon name="check" size={20} />
                                                    MARCAR COMO CONCLUÍDO
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    <div className="absolute -right-8 -bottom-8 opacity-[0.03]">
                                        <Icon name="zap" size={200} />
                                    </div>
                                </section>

                                <section className="bg-white p-8 rounded-[2.5rem] card-shadow border border-slate-50">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-bold text-lg flex items-center gap-2 italic">
                                            <Icon name="note" className="text-amber-500" /> Rascunho / Demandas Extras
                                        </h3>
                                        <span className="text-[10px] bg-amber-50 text-amber-600 px-2 py-1 rounded-lg font-bold uppercase italic tracking-wider">Salvo na Nuvem</span>
                                    </div>
                                    <textarea
                                        className="w-full h-44 bg-slate-50 rounded-3xl p-6 text-sm border-none focus:ring-2 focus:ring-indigo-100 resize-none font-medium text-slate-600"
                                        placeholder="Links de vagas, detalhes das cirurgias ou compromissos que surgirem..."
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                    ></textarea>
                                </section>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                                    <h3 className="font-bold text-lg mb-6 flex items-center gap-2 italic">
                                        <Icon name="code" className="text-blue-400" /> Foco Java Pós
                                    </h3>
                                    <div className="space-y-4">
                                        {fixedRoutine.filter(r => r.type === 'study').map(item => (
                                            <div key={item.id} className="flex items-center gap-3">
                                                <button onClick={() => toggleRoutine(item.id)} className={`w-6 h-6 rounded-lg flex items-center justify-center transition-all ${item.done ? 'bg-emerald-500 border-transparent' : 'bg-white/10 border border-white/20'}`}>
                                                    {item.done && <Icon name="check" size={14} />}
                                                </button>
                                                <span className={`text-sm font-medium ${item.done ? 'text-white/40 line-through' : 'text-white/90'}`}>{item.title}</span>
                                            </div>
                                        ))}
                                        {fixedRoutine.filter(r => r.type === 'study').length === 0 && <p className="text-sm text-slate-500 italic">Nenhum bloco de estudo agendado hoje.</p>}
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-[2.5rem] card-shadow border border-slate-50">
                                    <h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2 uppercase tracking-tighter">
                                        <Icon name="briefcase" className="text-indigo-500" /> Profissional
                                    </h3>
                                    <div className="space-y-4">
                                        {fixedRoutine.filter(r => r.type === 'work' || r.type === 'career').map(item => (
                                            <div key={item.id} className="flex items-center gap-3">
                                                <button onClick={() => toggleRoutine(item.id)} className={`w-5 h-5 rounded-full border-2 transition-all ${item.done ? 'bg-indigo-500 border-indigo-500' : 'border-slate-200'}`}></button>
                                                <span className={`text-xs font-bold ${item.done ? 'text-slate-300 line-through' : 'text-slate-600'}`}>{item.title}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'day' && (
                        <div className="max-w-4xl mx-auto space-y-4">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 italic uppercase tracking-tighter">
                                    <div className="w-2 h-8 bg-indigo-600 rounded-full"></div> Bloco a Bloco
                                </h3>
                                <div className="flex items-center gap-3">
                                    {progress === 100 && fixedRoutine.length > 0 && (
                                        <div className="text-[10px] font-black text-emerald-600 bg-emerald-50 px-4 py-2 rounded-full uppercase tracking-widest border border-emerald-100 animate-bounce">
                                            Metas Batidas! 🏆
                                        </div>
                                    )}
                                    <button
                                        onClick={() => setShowAddModal(true)}
                                        className="bg-indigo-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all"
                                    >
                                        <Icon name="plus" size={16}/> Adicionar Tarefa
                                    </button>
                                </div>
                            </div>

                            {fixedRoutine.map(item => (
                                <div key={item.id} className={`p-5 rounded-3xl border transition-all flex items-center justify-between ${item.done ? 'bg-emerald-50 border-transparent opacity-60' : 'bg-white border-slate-100 shadow-sm'}`}>
                                    <div className="flex items-center gap-6">
                                        <div className="text-xs font-black text-indigo-500 bg-indigo-50 px-3 py-1 rounded-lg w-20 text-center uppercase tracking-tighter">{item.time}</div>
                                        <div>
                                            <span className={`font-bold text-lg ${item.done ? 'text-emerald-700 line-through' : 'text-slate-800'}`}>{item.title}</span>
                                            <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest mt-1">{item.type.toUpperCase()}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {confirmDeleteId === item.id ? (
                                            <div className="flex items-center gap-2 bg-red-50 p-1 rounded-xl border border-red-100 animate-in fade-in slide-in-from-right-2">
                                                <span className="text-[10px] font-bold text-red-600 uppercase px-2">Excluir?</span>
                                                <button onClick={() => deleteTask(item.id)} className="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center hover:bg-red-600 transition-all">
                                                    <Icon name="check" size={16} />
                                                </button>
                                                <button onClick={() => setConfirmDeleteId(null)} className="w-8 h-8 rounded-lg bg-white text-slate-400 border border-slate-200 flex items-center justify-center hover:bg-slate-100 transition-all">
                                                    <Icon name="close" size={16} />
                                                </button>
                                            </div>
                                        ) : (
                                            <>
                                                <button onClick={() => setConfirmDeleteId(item.id)} className="w-10 h-10 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all">
                                                    <Icon name="trash" size={18} />
                                                </button>
                                                <button onClick={() => toggleRoutine(item.id)} className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${item.done ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-50 text-slate-400 hover:text-indigo-500'}`}>
                                                    <Icon name="check" size={20} />
                                                </button>
                                            </>
                                        )}
                                    </div>
                                </div>
                            ))}

                            {fixedRoutine.length === 0 && (
                                <div className="text-center py-12">
                                    <p className="text-slate-500">Sua rotina está vazia.</p>
                                    <p className="text-sm text-slate-400 mt-1">Adicione tarefas para organizar seu dia.</p>
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'ai' && (
                        <div className="max-w-2xl mx-auto text-center py-10">
                            <div className="w-20 h-20 morning-gradient rounded-[2rem] flex items-center justify-center text-white mx-auto mb-8 shadow-2xl">
                                <Icon name="zap" size={40} />
                            </div>
                            <h3 className="text-3xl font-black text-slate-800 mb-4 tracking-tighter italic">Integração Gemini</h3>
                            <p className="text-slate-500 mb-10 leading-relaxed font-medium">Use o prompt abaixo para sincronizar seus blocos com o Google Agenda e Tasks.</p>

                            <div className="bg-slate-900 p-8 rounded-[2.5rem] text-left mb-8 shadow-inner border-b-4 border-indigo-500">
                                <p className="text-[10px] font-black text-indigo-300 uppercase mb-4 tracking-widest">Prompt de Sincronização</p>
                                <p className="text-sm text-indigo-100 font-mono italic leading-relaxed">
                                    "Gemini, use a extensão do Google Agenda. Minha rotina hoje é: {fixedRoutine.filter(r => !r.done).map(r => r.title + ' às ' + r.time).join(', ')}. Certifique-se de que os blocos de Pós Java e LinkedIn estejam priorizados. Notas extras do dia: {notes}"
                                </p>
                            </div>

                            <button
                                onClick={() => {
                                    const promptText = `Gemini, use a extensão do Google Agenda. Minha rotina hoje é: ${fixedRoutine.filter(r => !r.done).map(r => r.title + ' às ' + r.time).join(', ')}. Priorize Java e LinkedIn. Notas: ${notes}`;
                                    navigator.clipboard.writeText(promptText);
                                }}
                                className="w-full py-5 career-gradient text-white rounded-3xl font-bold shadow-2xl hover:brightness-110 transition-all flex items-center justify-center gap-3 active:scale-95"
                            >
                                <Icon name="copy" /> COPIAR PROMPT PARA O GEMINI
                            </button>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white p-8 rounded-[2rem] w-full max-w-md card-shadow border border-slate-100 animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-black text-slate-800 tracking-tight italic">Nova Tarefa</h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-700 bg-slate-50 p-2 rounded-full">
                                        <Icon name="close" size={20} />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Título</label>
                                        <input
                                            type="text"
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="Ex: Revisão de Pull Requests"
                                            value={newTask.title}
                                            onChange={e => setNewTask({...newTask, title: e.target.value})}
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Horário</label>
                                            <input
                                                type="time"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                                                value={newTask.time}
                                                onChange={e => setNewTask({...newTask, time: e.target.value})}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Categoria</label>
                                            <select
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none appearance-none"
                                                value={newTask.type}
                                                onChange={e => setNewTask({...newTask, type: e.target.value})}
                                            >
                                                <option value="basic">Básico</option>
                                                <option value="study">Estudo (Java)</option>
                                                <option value="career">Carreira (LinkedIn)</option>
                                                <option value="work">Trabalho / Vagas</option>
                                                <option value="health">Saúde / Fitness</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button
                                        onClick={addTask}
                                        className="w-full mt-4 bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95"
                                    >
                                        SALVAR NA ROTINA
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </main>
            </div>
        );
    };

    const SidebarItem = ({ icon, label, active, onClick }) => (
        <button
            onClick={onClick}
            className={`w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl transition-all ${active ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}
        >
            <Icon name={icon} />
            <span className="hidden lg:block font-bold text-sm tracking-tighter uppercase">{label}</span>
        </button>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
