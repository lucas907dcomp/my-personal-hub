<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel Hub - Controle de Consumo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900">
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  // --- DOMAIN LOGIC (Integrado com Spring Boot) ---
  function useFuelTracker() {
    const [records, setRecords] = useState([]);

    // GET: Busca os dados da API Java
    const fetchRecords = async () => {
      try {
        const response = await fetch('/api/fuel');
        if (response.ok) {
          const data = await response.json();
          setRecords(data);
        }
      } catch (error) {
        console.error("Erro ao conectar com a API:", error);
      }
    };

    useEffect(() => {
      fetchRecords();
    }, []);

    // POST: Envia para o Java salvar
    const addRecord = async (totalValue, pricePerLiter, odometer, fuelType) => {
      const newRecord = {
        totalValue: Number(totalValue),
        pricePerLiter: Number(pricePerLiter),
        odometer: Number(odometer),
        fuelType: fuelType
      };

      try {
        const response = await fetch('/api/fuel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newRecord)
        });

        if (response.ok) {
          const savedRecord = await response.json();
          setRecords([savedRecord, ...records]);
        }
      } catch (error) {
        console.error("Erro ao salvar:", error);
      }
    };

    // DELETE: Apaga no Java pelo ID
    const deleteRecord = async (id) => {
      if(confirm('Tem certeza que deseja excluir este registro?')) {
        try {
          const response = await fetch(`/api/fuel/${id}`, {
            method: 'DELETE'
          });

          if (response.ok) {
            setRecords(records.filter(record => record.id !== id));
          }
        } catch (error) {
          console.error("Erro ao deletar:", error);
        }
      }
    };

    // Analytics da aplicação
    const calculateStats = () => {
      if (records.length < 2) {
        return { avgGlobal: 0, gasAvg: 0, ethAvg: 0, myRatio: 0.70, totalDistance: 0, totalSpent: 0, costPerKm: '0.00' };
      }

      const chrono = [...records].reverse();

      let gasDistance = 0, gasLiters = 0;
      let ethDistance = 0, ethLiters = 0;
      let totalDistance = 0, totalSpent = 0;

      for (let i = 0; i < chrono.length - 1; i++) {
        const current = chrono[i];
        const next = chrono[i + 1];
        const segmentDistance = next.odometer - current.odometer;

        totalDistance += segmentDistance;

        if (current.fuelType === 'Gasolina') {
          gasDistance += segmentDistance;
          gasLiters += current.liters;
        } else {
          ethDistance += segmentDistance;
          ethLiters += current.liters;
        }
      }

      totalSpent = records.reduce((acc, curr) => acc + curr.totalValue, 0);
      const totalLitersAll = chrono.slice(0, -1).reduce((acc, curr) => acc + curr.liters, 0);

      const avgGlobal = totalLitersAll > 0 ? (totalDistance / totalLitersAll).toFixed(2) : 0;
      const gasAvg = gasLiters > 0 ? (gasDistance / gasLiters).toFixed(2) : 0;
      const ethAvg = ethLiters > 0 ? (ethDistance / ethLiters).toFixed(2) : 0;

      const costPerKm = totalDistance > 0 ? (totalSpent / totalDistance).toFixed(2) : '0.00';

      let myRatio = 0.70;
      if (gasAvg > 0 && ethAvg > 0) {
        myRatio = (ethAvg / gasAvg);
      }

      return { avgGlobal, gasAvg, ethAvg, myRatio, totalDistance, totalSpent, costPerKm };
    };

    return { records, addRecord, deleteRecord, stats: calculateStats() };
  }

  // --- UI COMPONENT ---
  function FuelHub() {
    const { records, addRecord, deleteRecord, stats } = useFuelTracker();

    const [totalValue, setTotalValue] = useState('');
    const [pricePerLiter, setPricePerLiter] = useState('');
    const [odometer, setOdometer] = useState('');
    const [fuelType, setFuelType] = useState('Gasolina');

    const handleSubmit = (e) => {
      e.preventDefault();
      if (!totalValue || !pricePerLiter || !odometer) return;
      addRecord(totalValue, pricePerLiter, odometer, fuelType);

      // Limpa apenas o valor e o odômetro, mantendo o preço e o combustível preenchidos por conveniência
      setTotalValue('');
      setOdometer('');
    };

    const ratioPercentage = (stats.myRatio * 100).toFixed(1);

    return (
            <div className="min-h-screen text-slate-100 p-6 font-sans">
              <div className="max-w-5xl mx-auto space-y-8">

                <header className="flex justify-between items-end border-b border-slate-700 pb-4">
                  <div>
                    <h1 className="text-3xl font-bold text-emerald-400">Fuel Hub</h1>
                    <p className="text-slate-400 text-sm mt-1">Analytics de Eficiência Automotiva</p>
                  </div>
                </header>

                <section className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 className="text-slate-400 text-xs uppercase tracking-wider mb-1">Média Global</h3>
                    <p className="text-2xl font-semibold text-white">{stats.avgGlobal} <span className="text-sm font-normal text-slate-400">km/L</span></p>
                  </div>
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 className="text-slate-400 text-xs uppercase tracking-wider mb-1">Média Gasolina</h3>
                    <p className="text-2xl font-semibold text-blue-400">{stats.gasAvg} <span className="text-sm font-normal text-slate-400">km/L</span></p>
                  </div>
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 className="text-slate-400 text-xs uppercase tracking-wider mb-1">Média Etanol</h3>
                    <p className="text-2xl font-semibold text-green-400">{stats.ethAvg} <span className="text-sm font-normal text-slate-400">km/L</span></p>
                  </div>
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 className="text-slate-400 text-xs uppercase tracking-wider mb-1">Seu Coeficiente</h3>
                    <p className="text-2xl font-semibold text-amber-400">{ratioPercentage}%</p>
                  </div>
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 col-span-2 lg:col-span-1">
                    <h3 className="text-slate-400 text-xs uppercase tracking-wider mb-1">Custo por km</h3>
                    <p className="text-2xl font-semibold text-rose-400">R$ {stats.costPerKm}</p>
                  </div>
                </section>

                <div className="bg-emerald-900/30 border border-emerald-500/30 p-4 rounded-xl flex items-center gap-4">
                  <div className="text-3xl">💡</div>
                  <div>
                    <h4 className="font-semibold text-emerald-300">Regra de Abastecimento:</h4>
                    <p className="text-sm text-emerald-100/80 mt-1">
                      O Etanol só vale a pena se o preço dele na bomba for <strong>menor ou igual a {ratioPercentage}%</strong> do preço da Gasolina.
                    </p>
                  </div>
                </div>

                <form onSubmit={handleSubmit} className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-sm text-slate-400 mb-1">Valor Total (R$)</label>
                      <input type="number" step="0.01" value={totalValue} onChange={(e) => setTotalValue(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:border-emerald-400 focus:outline-none transition-colors" required />
                    </div>
                    <div>
                      <label className="block text-sm text-slate-400 mb-1">Preço do Litro (R$)</label>
                      <input type="number" step="0.01" value={pricePerLiter} onChange={(e) => setPricePerLiter(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:border-emerald-400 focus:outline-none transition-colors" required />
                    </div>
                    <div>
                      <label className="block text-sm text-slate-400 mb-1">Odômetro (km)</label>
                      <input type="number" value={odometer} onChange={(e) => setOdometer(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:border-emerald-400 focus:outline-none transition-colors" required />
                    </div>
                    <div>
                      <label className="block text-sm text-slate-400 mb-1">Combustível</label>
                      <select value={fuelType} onChange={(e) => setFuelType(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:border-emerald-400 focus:outline-none transition-colors">
                        <option value="Gasolina">Gasolina</option>
                        <option value="Etanol">Etanol</option>
                      </select>
                    </div>
                  </div>
                  <div className="pt-2">
                    <button type="submit" className="w-full md:w-auto bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2.5 px-8 rounded-lg transition-colors">
                      Registrar Abastecimento
                    </button>
                  </div>
                </form>

                <section>
                  <h2 className="text-xl font-semibold mb-4 text-slate-200">Histórico de Registros</h2>
                  <div className="space-y-3">
                    {records.map((record) => (
                            <div key={record.id} className="bg-slate-800 p-4 rounded-lg flex flex-col sm:flex-row sm:justify-between sm:items-center border border-slate-700 hover:border-slate-500 transition-colors gap-4">
                              <div className="flex-1">
                                <div className="flex items-center gap-3 mb-1">
                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${record.fuelType === 'Gasolina' ? 'bg-blue-900/50 text-blue-300' : 'bg-green-900/50 text-green-300'}`}>
                          {record.fuelType}
                        </span>
                                  <span className="font-semibold text-slate-200">{record.liters} Litros</span>
                                  <span className="text-slate-400 text-sm hidden sm:inline">• R$ {record.pricePerLiter}/L</span>
                                </div>
                                <div className="text-sm text-slate-500">
                                  Odômetro: <span className="text-slate-300">{record.odometer} km</span> |
                                  Data: {new Date(record.date).toLocaleDateString('pt-BR')}
                                </div>
                              </div>

                              <div className="flex items-center justify-between sm:justify-end gap-6">
                                <div className="text-left sm:text-right">
                                  <p className="text-xs text-slate-400">Total Pago</p>
                                  <p className="font-bold text-rose-400">R$ {record.totalValue.toFixed(2)}</p>
                                </div>
                                <button onClick={() => deleteRecord(record.id)} className="text-slate-500 hover:text-red-400 p-2 rounded-md hover:bg-slate-700 transition-colors" title="Excluir registro">
                                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                                </button>
                              </div>
                            </div>
                    ))}
                    {records.length === 0 && (
                            <div className="text-center py-10 bg-slate-800/50 rounded-xl border border-dashed border-slate-700">
                              <p className="text-slate-500">Nenhum abastecimento registrado.</p>
                            </div>
                    )}
                  </div>
                </section>

              </div>
            </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<FuelHub />);
</script>
</body>
</html>
